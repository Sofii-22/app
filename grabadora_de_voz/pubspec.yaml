name: grabadora_de_voz
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter

 
  cupertino_icons: ^1.0.8
  flex_color_scheme: ^8.4.0
  firebase_core: ^5.0.0
  cloud_firestore: ^7.0.0
  record: ^7.1.2
  just_audio: ^0.10.6
  firebase_storage: ^14.0.1
  path_provider: ^2.1.6
  file_selector: ^1.1.0
  firebase_auth: ^7.0.1
  google_sign_in: ^7.2.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  
  flutter_lints: ^6.0.0


flutter:
 uses-material-design: true 

 fonts:
   - family: DM Sans 
     fonts:
      - asset: assets/fonts/DMSans-Light.ttf
        weight: 300
      - asset: assets/fonts/DMSans-Regular.ttf
        weight: 400
      - asset: assets/fonts/DMSans-Medium.ttf
        weight: 500
      
       
      
     
  
  

    
 
  
    



